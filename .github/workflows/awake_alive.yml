name: Keep Streamlit Apps Awake

on:
  schedule:
    # Streamlit의 12시간 동면 기준보다 충분히 짧게 실행하고,
    # GitHub Actions가 몰리는 정각을 피해 지연 가능성을 낮춥니다.
    - cron: '17 */6 * * *'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/awake_alive.yml'
      - '.github/scripts/keep_streamlit_awake.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  keep-awake:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Playwright
        run: |
          python -m pip install --disable-pip-version-check playwright==1.62.0
          python -m playwright install --with-deps chromium

      - name: Open Streamlit apps in Chromium
        run: python .github/scripts/keep_streamlit_awake.py

      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: keep-awake-failure-screenshots
          path: playwright-artifacts/
          if-no-files-found: ignore
          retention-days: 7
